:`Уровень контрольной`,statement:`При 772,7 °C для CaCO₃(тв) ⇄ CaO(тв) + CO₂(г) p(CO₂) = 0,3 атм. Прими стандартное давление 1 атм, ΔS° = 160,5 Дж/(моль·К), постоянные ΔH° и ΔS°. ΔH°f(CaCO₃) = −1206,9, ΔH°f(CO₂) = −393,5, атомизация Ca = 178,2, диссоциация O₂ = 493,6, ионизация Ca до Ca²⁺ = 1747,7, O(г) + 2e⁻ → O²⁻(г) = +703,0 кДж/моль. R = 8,314 Дж/(моль·К). Определи энтальпию образования и диссоциации решётки CaO.`,theory:`При равновесии 0 = ΔG° + RT ln Q, где Q = pCO₂/p°. Затем ΔH° = ΔG° + TΔS°. По закону Гесса ΔH°реакции = ΣΔH°f(продуктов) − ΣΔH°f(исходных). Цикл Борна — Габера связывает образование кристалла с получением газообразных ионов.`,example:`Для T = 1045,85 К: ΔG° = −RT ln(0,3) ≈ +10,47 кДж/моль. Энтальпия диссоциации решётки положительна; энтальпия её образования имеет противоположный знак.`,steps:[M(`dg`,`Найди ΔG° реакции при этой температуре.`,`10.47`,`кДж/моль`,`Используй −RT ln(0,3); переведи Дж в кДж.`,`ΔG° = −8,314·1045,85·ln(0,3)/1000 = +10,47 кДж/моль.`,.15),M(`dh`,`Найди ΔH° разложения.`,`178.33`,`кДж/моль`,`ΔH° = ΔG° + TΔS°.`,`10,47 + 1045,85·0,1605 = 178,33 кДж/моль.`,.3),M(`hf`,`Найди ΔH°f(CaO).`,`-635.07`,`кДж/моль`,`178,33 = ΔH°f(CaO) − 393,5 + 1206,9.`,`ΔH°f(CaO) = 178,33 + 393,5 − 1206,9 = −635,07 кДж/моль.`,.4),M(`lattice`,`Найди энтальпию диссоциации кристаллической решётки CaO на газообразные ионы.`,`3510.77`,`кДж/моль`,`Сложи атомизацию, половину диссоциации O₂, ионизацию и присоединение электронов; вычти ΔH°f(CaO).`,`Uдисс = 178,2 + 493,6/2 + 1747,7 + 703,0 − (−635,07) ≈ 3510,8 кДж/моль. Знак образования решётки противоположен.`,1)]},{id:`c-cscl`,module:`crystal`,title:`Структура CsCl`,difficulty:`Повышенный`,statement:`В кубической ячейке Cl⁻ занимает 8 вершин, Cs⁺ находится в центре куба.`,theory:`В структуре CsCl каждая частица окружена восемью частицами другого сорта; полиэдр — куб. Это примитивная кубическая решётка с базисом из двух разных частиц, а не ОЦК-решётка одного элемента.`,example:`Восемь вершин по ⅛ дают одну частицу на ячейку.`,steps:[M(`a`,`Число Cl⁻ в ячейке`,`1`,``,`Вершины принадлежат восьми ячейкам.`,`8·⅛ = 1.`),M(`b`,`Число Cs⁺ в ячейке`,`1`,``,`Центр принадлежит одной ячейке.`,`Один ион внутри ячейки.`),M(`coord`,`Координационное число`,`8`,``,`Центральный ион окружён вершинами куба.`,`КЧ 8:8, полиэдр — куб.`),j(`type`,`Тип решётки Браве`,`Примитивная кубическая`,[`Примитивная кубическая`,`Объёмноцентрированная кубическая`,`Гранецентрированная кубическая`],`Центральный атом другого химического сорта.`,`Разные ионы не связаны трансляцией решётки Браве.`)]},{id:`s-carbonates`,module:`separation`,title:`Церуссит и доломит: разделение катионов`,difficulty:`Уровень контрольной`,statement:`Смесь PbCO₃ и CaMg(CO₃)₂ обработана избытком HNO₃. Предложи последовательность разделения Pb²⁺, Ca²⁺ и Mg²⁺ из полученного раствора. Для учебной схемы используй осаждение PbSO₄, затем CaC₂O₄ и Mg(OH)₂. Считай условия подобранными для полноты разделения.`,theory:`Вскрытие переводит компоненты в раствор; селективное осаждение и фильтрование разделяют катионы. Избыток осадителя, кислотность и растворимость влияют на чистоту. Осадок на каждом этапе нужно отделить до следующей операции.`,example:`Карбонат реагирует с кислотой с образованием соли, CO₂ и воды. Термодинамически возможная схема ещё требует контроля pH и полноты осаждения.`,steps:[N(`dissolve`,`Запиши уравнение вскрытия PbCO₃ азотной кислотой.`,`PbCO3 + 2HNO3 → Pb(NO3)2 + CO2 + H2O`,`Карбонат + кислота → нитрат + CO₂ + H₂O.`,`PbCO₃ + 2HNO₃ → Pb(NO₃)₂ + CO₂↑ + H₂O.`),N(`dolomite`,`Запиши вскрытие доломита.`,`CaMg(CO3)2 + 4HNO3 → Ca(NO3)2 + Mg(NO3)2 + 2CO2 + 2H2O`,`В доломите две карбонатные группы.`,`CaMg(CO₃)₂ + 4HNO₃ → Ca(NO₃)₂ + Mg(NO₃)₂ + 2CO₂ + 2H₂O.`),j(`lead`,`Каким реагентом осадить Pb²⁺ первым?`,`Сульфат натрия`,[`Сульфат натрия`,`Хлорид натрия`,`Нитрат натрия`],`Выбери малорастворимый сульфат свинца.`,`Образуется PbSO₄↓; выделенный осадок отфильтровывают.`),N(`lead-eq`,`Запиши молекулярное уравнение осаждения свинца сульфатом натрия.`,`Pb(NO3)2 + Na2SO4 → PbSO4 + 2NaNO3`,`Pb²⁺ + SO₄²⁻ → PbSO₄.`,`Pb(NO₃)₂ + Na₂SO₄ → PbSO₄↓ + 2NaNO₃.`),j(`filter1`,`Что сделать до осаждения кальция?`,`Отфильтровать PbSO₄`,[`Отфильтровать PbSO₄`,`Нагреть до сухого остатка`,`Добавить избыток кислоты`],`Раздели твёрдую и жидкую фазы.`,`Фильтрация удаляет свинец из раствора.`),j(`ca`,`Как осадить Ca²⁺ из фильтрата при контролируемом pH?`,`Оксалатом аммония`,[`Оксалатом аммония`,`Нитратом калия`,`Разбавленной HNO₃`],`Образуется малорастворимый оксалат кальция.`,`Ca²⁺ + C₂O₄²⁻ → CaC₂O₄↓; требуется контролировать pH и состав.`),j(`mg`,`После отделения CaC₂O₄ как осадить Mg²⁺?`,`Добавить щёлочь`,[`Добавить щёлочь`,`Добавить HNO₃`,`Добавить воду`],`Вспомни малорастворимый гидроксид магния.`,`Mg²⁺ + 2OH⁻ → Mg(OH)₂↓. Схема — учебная, необходим контроль pH и полноты разделения.`)]},{id:`s-ampho`,module:`separation`,title:`Оксиды Al₂O₃ и Fe₂O₃`,difficulty:`Повышенный`,statement:`Предложи схему разделения смеси Al₂O₃ и Fe₂O₃. В распоряжении водный NaOH, CO₂ и фильтрование; смесь нагревают с концентрированным раствором щёлочи.`,theory:`Амфотерный оксид Al₂O₃ растворяется в щёлочи с образованием алюмината; Fe₂O₃ в этих условиях практически не растворяется. Из раствора алюмината можно осадить Al(OH)₃ пропусканием CO₂.`,example:`Фильтрование отделяет нерастворимый Fe₂O₃ до осаждения Al(OH)₃.`,steps:[j(`reagent`,`Что выбрать для вскрытия смеси?`,`Концентрированный NaOH, нагревание`,[`Концентрированный NaOH, нагревание`,`Вода, комнатная температура`,`Разбавленная HCl, затем сразу фильтрация`],`Нужен реагент, растворяющий только амфотерный оксид.`,`Al₂O₃ переходит в раствор, Fe₂O₃ остаётся в осадке.`),N(`dissolve`,`Запиши растворение Al₂O₃ в водном NaOH.`,`Al2O3 + 2NaOH + 3H2O → 2Na[Al(OH)4]`,`Продукт — тетрагидроксоалюминат натрия.`,`Al₂O₃ + 2NaOH + 3H₂O → 2Na[Al(OH)₄].`),j(`separate`,`Как отделить Fe₂O₃?`,`Фильтрование`,[`Фильтрование`,`Перегонка`,`Хроматография газа`],`Один компонент остался твёрдым.`,`Fe₂O₃ остаётся на фильтре.`),N(`precip`,`Запиши осаждение Al(OH)₃ из Na[Al(OH)₄] углекислым газом.`,`Na[Al(OH)4] + CO2 → Al(OH)3 + NaHCO3`,`В условиях избытка CO₂ образуется гидрокарбонат.`,`Na[Al(OH)₄] + CO₂ → Al(OH)₃↓ + NaHCO₃.`)]},{id:`s-sulfide`,module:`separation`,title:`Вскрытие сульфида цинка`,difficulty:`Повышенный`,statement:`Образец ZnS нужно перевести в раствор сульфата цинка и отделить нерастворимый инертный остаток. На первой стадии ZnS обжигают на воздухе, газы улавливают; затем твёрдый продукт обрабатывают разбавленной H₂SO₄.`,theory:`Окислительный обжиг переводит сульфид в оксид, а серу — в SO₂. Выделение токсичного SO₂ требует газоочистки. Затем оксид растворяют в кислоте и фильтруют нерастворимый остаток.`,example:`2ZnS + 3O₂ → 2ZnO + 2SO₂ при обжиге; стехиометрия учитывает кислород в обоих продуктах.`,steps:[j(`method`,`Выбери способ первой стадии.`,`Окислительный обжиг`,[`Окислительный обжиг`,`Растворение в воде`,`Прокаливание без кислорода`],`Нужно окислить сульфид до оксида.`,`Обжиг на воздухе образует ZnO и SO₂.`),N(`roast`,`Запиши уравнение обжига.`,`2ZnS + 3O2 → 2ZnO + 2SO2`,`Уравняй Zn и S, затем O.`,`2ZnS + 3O₂ → 2ZnO + 2SO₂↑.`),N(`acid`,`Запиши растворение полученного оксида в H₂SO₄.`,`ZnO + H2SO4 → ZnSO4 + H2O`,`Основный оксид реагирует с кислотой.`,`ZnO + H₂SO₄ → ZnSO₄ + H₂O.`),j(`filter`,`Как отделить нерастворимый инертный остаток?`,`Фильтрование`,[`Фильтрование`,`Добавить NaOH в избытке`,`Выпарить раствор до начала фильтрации`],`Нужное соединение находится в растворе.`,`Фильтрование отделяет остаток от раствора ZnSO₄.`)]},{id:`s-silicate`,module:`separation`,title:`Силикат и алюмосиликат`,difficulty:`Уровень контрольной`,statement:`Для учебной схемы вскрытия SiO₂ и каолинита Al₂Si₂O₅(OH)₄ используют сплавление с Na₂CO₃ при нагревании. Сначала запиши образование силикатов, затем перевод силиката натрия в кремниевую кислоту действием HCl. Продукты сплавления каолинита: NaAlO₂, Na₂SiO₃, CO₂ и H₂O.`,theory:`Сплавление с карбонатом натрия разрушает прочные силикатные структуры с образованием растворимых продуктов. Последующая обработка кислотой осаждает гидратированный диоксид кремния, условно записываемый H₂SiO₃; реальный состав осадка переменный.`,example:`SiO₂ + Na₂CO₃ → Na₂SiO₃ + CO₂ при нагревании.`,steps:[j(`method`,`Какой метод выбрать для вскрытия устойчивой силикатной решётки?`,`Сплавление с Na₂CO₃`,[`Сплавление с Na₂CO₃`,`Обработка водой`,`Фильтрование через бумагу`],`Нужен высокотемпературный реагент для разрушения структуры.`,`При сплавлении образуются силикаты натрия.`),N(`silica`,`Запиши сплавление SiO₂ с Na₂CO₃.`,`SiO2 + Na2CO3 → Na2SiO3 + CO2`,`Продукты указаны в примере.`,`SiO₂ + Na₂CO₃ → Na₂SiO₃ + CO₂↑.`),N(`kaolin`,`Запиши сплавление каолинита с Na₂CO₃ по указанной схеме.`,`Al2Si2O5(OH)4 + 3Na2CO3 → 2NaAlO2 + 2Na2SiO3 + 3CO2 + 2H2O`,`Сначала уравняй Al и Si, затем Na и CO₂.`,`Al₂Si₂O₅(OH)₄ + 3Na₂CO₃ → 2NaAlO₂ + 2Na₂SiO₃ + 3CO₂ + 2H₂O.`),N(`acid`,`Запиши условное осаждение кремниевой кислоты из силиката натрия кислотой.`,`Na2SiO3 + 2HCl → H2SiO3 + 2NaCl`,`На один силикат-ион нужны два протона.`,`Na₂SiO₃ + 2HCl → H₂SiO₃↓ + 2NaCl. Осадок — гидратированный SiO₂ переменного состава.`)]},{id:`d-hydration`,module:`detective`,title:`Металл, хлорид и сульфид`,difficulty:`Уровень контрольной`,statement:`Металл X образует летучий безводный хлорид X₁. На влажном воздухе X₁ превращается в кристаллогидрат X₂ с шестью молекулами воды на формульную единицу; масса возрастает примерно на 81%. Сульфид X₃ полностью гидролизуется водой до амфотерного гидроксида X₄ и H₂S. Известно, что X трёхвалентен. Атомные массы: Al 27, Cl 35,5, H 1, O 16.`,theory:`Отношение прироста массы к массе безводной соли равно массе воды, делённой на молярную массу соли. Рассчитав молярную массу хлорида, проверь состав и всю цепочку.`,example:`6 молей воды имеют массу 108 г. При увеличении массы на 81% M(X₁) ≈ 108/0,81 = 133,3 г/моль.`,steps:[M(`mass`,`Найди приблизительную молярную массу X₁.`,`133.33`,`г/моль`,`Раздели массу 6H₂O на 0,810.`,`M(X₁) = 108 / 0,810 ≈ 133,3 г/моль.`,.4),Qe(`metal`,`Определи металл X.`,`Al`,`Вычти массу трёх атомов Cl из молярной массы хлорида.`,`133,3 − 3·35,5 ≈ 26,8 г/моль; X — Al.`),Qe(`chloride`,`Формула X₁`,`AlCl3`,`Металл трёхвалентен.`,`X₁ = AlCl₃; M = 133,5 г/моль.`),Qe(`hydrate`,`Формула X₂`,`AlCl3.6H2O`,`Хлорид содержит шесть молекул воды.`,`AlCl₃·6H₂O: 108/133,5 ≈ 80,9%, что округляется до 81%.`,[`AlCl3·6H2O`]),Qe(`sulfide`,`Формула X₃`,`Al2S3`,`Соедини Al³⁺ и S²⁻.`,`X₃ = Al₂S₃.`),Qe(`hydroxide`,`Формула X₄`,`Al(OH)3`,`Продукт гидролиза амфотерен.`,`X₄ = Al(OH)₃.`),N(`hydrolysis`,`Запиши полный гидролиз X₃.`,`Al2S3 + 6H2O → 2Al(OH)3 + 3H2S`,`Уравняй Al, S, затем H и O.`,`Al₂S₃ + 6H₂O → 2Al(OH)₃↓ + 3H₂S↑.`)]},{id:`d-al`,module:`detective`,title:`Металл X и белый студенистый осадок`,difficulty:`Повышенный`,statement:`Металл X массой 2,70 г растворили в избытке HCl; выделилось 3,36 л H₂ (н.у.). X образует амфотерный гидроксид X₁, растворимый как в HCl, так и в избытке NaOH. Считай, что металл трёхвалентен; Vm = 22,4 л/моль.`,theory:`Из объёма газа находят количество H₂. По электронной стехиометрии для трёхвалентного металла 2X дают 3H₂. Затем находят молярную массу и проверяют химические свойства.`,example:`n(H₂) = V/Vm; n(X) = 2n(H₂)/3; M(X) = m/n(X).`,steps:[M(`h2`,`Найди количество H₂.`,`0.15`,`моль`,`Раздели объём на 22,4 л/моль.`,`3,36/22,4 = 0,150 моль.`,.005),M(`metal`,`Найди количество X.`,`0.10`,`моль`,`2 моль X образуют 3 моль H₂.`,`n(X) = 2/3·0,15 = 0,100 моль.`,.005),M(`m`,`Найди молярную массу X.`,`27`,`г/моль`,`Раздели массу на количество.`,`2,70/0,100 = 27,0 г/моль.`,.2),Qe(`x`,`Определи X.`,`Al`,`Металл третьей группы с атомной массой 27.`,`X — алюминий.`),Qe(`x1`,`Запиши формулу X₁.`,`Al(OH)3`,`Гидроксид алюминия амфотерен.`,`X₁ = Al(OH)₃.`),N(`eq1`,`Запиши реакцию X с HCl.`,`2Al + 6HCl → 2AlCl3 + 3H2`,`Al окисляется до +3.`,`2Al + 6HCl → 2AlCl₃ + 3H₂↑.`),N(`eq2`,`Запиши реакцию X₁ с избытком водного NaOH.`,`Al(OH)3 + NaOH → Na[Al(OH)4]`,`В растворе образуется тетрагидроксоалюминат.`,`Al(OH)₃ + NaOH → Na[Al(OH)₄].`)]},{id:`d-hydrate`,module:`detective`,title:`Кристаллогидрат сульфата меди`,difficulty:`Базовый`,statement:`При нагревании 2,50 г CuSO₄·xH₂O до безводной соли масса уменьшилась до 1,60 г. Найди x. Используй M(CuSO₄) = 160 г/моль, M(H₂O) = 18 г/моль.`,theory:`Масса воды равна разности масс; отношение количества воды к количеству безводной соли определяет x.`,example:`n(H₂O)/n(CuSO₄) = x.`,steps:[M(`water`,`Масса удалённой воды`,`0.90`,`г`,`Вычти конечную массу из исходной.`,`2,50 − 1,60 = 0,90 г.`,.02),M(`ratio`,`Определи x.`,`5`,``,`Сравни 0,90/18 и 1,60/160.`,`n(H₂O) = 0,050 моль; n(CuSO₄) = 0,010 моль, x = 5.`),N(`dehydrate`,`Запиши разложение кристаллогидрата.`,`CuSO4.5H2O → CuSO4 + 5H2O`,`Коэффициент перед водой равен x.`,`CuSO₄·5H₂O → CuSO₄ + 5H₂O при нагревании.`)]},{id:`p-eutectic`,module:`phase`,title:`Бинарная эвтектика A–B`,difficulty:`Повышенный`,statement:`Модельная диаграмма при постоянном давлении: чистый A плавится при 1000 K, чистый B — при 800 K, эвтектика E находится при 40 мол.% B и 600 K. Линии ликвидуса приняты прямыми. Исходный расплав содержит 20 мол.% B.`,theory:`При постоянном давлении правило фаз: F = C − P + 1. В двухфазной области составы фаз определяют по концам горизонтальной коноды, а относительные количества — правилом рычага.`,example:`Для бинарной системы C = 2. В эвтектической точке L + A + B: P = 3 и F = 0.`,steps:[M(`phase`,`Сколько фаз в области L + A?`,`2`,``,`Жидкость и твёрдый A.`,`Две фазы: жидкий раствор L и твёрдый A.`),M(`freedom`,`Число степеней свободы в области L + A при постоянном давлении?`,`1`,``,`F = 2 − P + 1.`,`F = 2 − 2 + 1 = 1.`),M(`start`,`При какой температуре начнётся кристаллизация расплава 20% B?`,`800`,`K`,`Левый ликвидус — прямая от (0;1000) до (40;600).`,`T = 1000 − 10·20 = 800 K.`),Qe(`first`,`Какая твёрдая фаза выделяется первой?`,`A`,`Точка находится слева от эвтектики.`,`Первой кристаллизуется A.`),M(`liquid`,`Каков состав жидкости ла делает опыт с водой опасным.`],[`Be`,`Бериллий`,2,4,`[He] 2s²`,`+2`,`Твёрдый, лёгкий металл, покрытый защитной оксидной плёнкой.`,`BeO и Be(OH)₂ амфотерны; характерны ковалентность связей и комплексы с координационным числом 4.`,`Be + 2OH⁻ + 2H₂O → [Be(OH)₄]²⁻ + H₂↑`,`Бериллий не реагирует с водой в обычных условиях из-за защитной плёнки. Соединения токсичны.`],[`Mg`,`Магний`,2,12,`[Ne] 3s²`,`+2`,`Лёгкий серебристый металл, горит ярким белым светом.`,`С холодной водой реагирует медленно; с водяным паром при нагревании образует MgO и H₂.`,`2Mg + O₂ → 2MgO`,`Горящий магний может восстанавливать CO₂, поэтому CO₂ не подходит для тушения.`],[`Ca`,`Кальций`,2,20,`[Ar] 4s²`,`+2`,`Серебристый активный металл.`,`С водой образует гидроксид и водород. CaCO₃ — основной компонент известняка.`,`CaCO₃ → CaO + CO₂↑`,`Ca(OH)₂ малорастворим; известковая вода мутнеет от CO₂.`],[`Sr`,`Стронций`,2,38,`[Kr] 5s²`,`+2`,`Мягкий металл; окрашивает пламя в карминово-красный цвет.`,`SrSO₄ малорастворим. Основность гидроксидов группы 2 возрастает сверху вниз.`,`Sr + 2H₂O → Sr(OH)₂ + H₂↑`,`Карбонаты щёлочноземельных металлов разлагаются при нагревании.`],[`Ba`,`Барий`,2,56,`[Xe] 6s²`,`+2`,`Активный металл; окрашивает пламя в жёлто-зелёный цвет.`,`Ba²⁺ используют для обнаружения сульфат-ионов по белому осадку BaSO₄.`,`BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl`,`Растворимые соли бария токсичны; BaSO₄ практически нерастворим.`],[`B`,`Бор`,13,5,`[He] 2s² 2p¹`,`+3`,`Твёрдый неметалл, существует в нескольких кристаллических модификациях.`,`B₂O₃ — кислотный оксид; борная кислота проявляет кислотность как акцептор OH⁻.`,`B(OH)₃ + H₂O ⇄ [B(OH)₄]⁻ + H⁺`,`Борная кислота — слабая одноосновная кислота Льюиса.`],[`Al`,`Алюминий`,13,13,`[Ne] 3s² 3p¹`,`+3`,`Лёгкий металл; защищён плотной оксидной плёнкой.`,`Al₂O₃ и Al(OH)₃ амфотерны; Al³⁺ сильно гидролизуется. Получают электролизом расплава Al₂O₃ в криолите.`,`Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻`,`Концентрированные HNO₃ и H₂SO₄ пассивируют алюминий на холоде.`],[`Ga`,`Галлий`,
